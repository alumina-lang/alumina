name: Build Alumina

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux aarch64
            os: ubuntu-24.04-arm
          - name: macOS arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Install LLVM 22 and lldb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev lldb-22

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LLVM_CONFIG=$(brew --prefix llvm)/bin/llvm-config" >> $GITHUB_ENV

      - name: Install Tree-sitter (with runtime)
        run: |
          npm install -g tree-sitter-cli
          curl -fsSL https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v0.26.5.tar.gz | tar -xz
          cd tree-sitter-*
          make -j4
          sudo make install
          if [ "$RUNNER_OS" = "Linux" ]; then sudo ldconfig; fi

      - name: Check
        timeout-minutes: 30
        run: make check -j4

  boot:
    name: alumina-boot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Install Tree-sitter
        run: npm install -g tree-sitter-cli

      - name: Test alumina-boot
        timeout-minutes: 10
        run: make test-boot

  boot-musl:
    name: alumina-boot (alpine)
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up packages
        run: apk add --no-cache gcc musl-dev make nodejs npm curl git clang-libclang

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Tree-sitter
        run: RUSTFLAGS=-Ctarget-feature=-crt-static cargo install tree-sitter-cli

      - name: Test alumina-boot
        timeout-minutes: 10
        run: make test-boot

  docker:
    name: Build docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
